name: Build and Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [source-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out current simulator main
        uses: actions/checkout@v4
        with:
          repository: ratatougym/ratatougym
          ref: main
          path: .source/rtgym

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt

      - name: Test docstring compilation
        run: python -m unittest discover -s tests -p 'test_docstring_build.py'

      - name: Regenerate API directives from current source
        run: sphinx-apidoc --force --no-toc -o . .source/rtgym/rtgym

      - name: Build documentation and homepage
        env:
          RTGYM_SOURCE: ${{ github.workspace }}/.source/rtgym
        run: |
          sphinx-build -b html -E -d _build/doctrees . _build/html
          python scripts/verify_site.py _build/html --source .source/rtgym

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
